# ============================================================
# VoxDrive RK 触摸屏 dashboard 配置（2026-09-05）
# 用途：dashboard 部署在 RK3588 触摸屏（1024x600 DSI）时经 VOX_CONF 加载，
#       七服务仍在 Jetson，跨板访问；录像节点在本机。
# 同步：由 rk/scripts/sync_to_rk.sh 随 jetson/config 上板。
# ============================================================

# ---------- Jetson 七服务主机（dashboard 跨板连）----------
jetson.ip = 192.168.137.190

# ---------- RK 本机（dashboard 直连本机录像服务）----------
rk.ip = 192.168.137.200
rk.status_port = 6700
rk.event_port = 6701

# ---------- dashboard ----------
dashboard.preview_url = rtsp://192.168.137.190:8554/live/dashcam   # 预览走 Jetson mediamtx
dashboard.dashcam_poll_s = 5
dashboard.theme = dark
dashboard.sensor_poll_s = 10
dashboard.nav_words = 行车记录:dashcam 记录仪:dashcam 车控:vehicle 车辆控制:vehicle 状态:status 设置:settings 主页:home 首页:home 桌面:home

# ---------- voice_service（R14：ASR/TTS 推理下沉 RK NPU）----------
voice.asr_pull = 6711              # PULL 收 Jetson mic_stream PCM（float32 16k mono）
voice.tts_rep = 6720               # REP 应答 Jetson tts_engine 的合成请求
voice.asr_dir = /home/cat/rk_asr   # encoder/decoder/joiner fp16 rknn + tokens + 输入序表
voice.tts_bin = /home/cat/rk_tts/single_speaker_fast.bin  # SummerTTS 引擎（与 Jetson 同款）
voice.endpoint_sil_s = 0.7         # ASR 终点：能量 VAD 静音时长（秒）
voice.vad_rms = 0.006              # 能量 VAD 门限（float32 PCM RMS）
voice.spk_sink = alsa_output.usb-Jieli_Technology_UACDemoV1.0_4150354132313206-00.analog-stereo  # 本板 USB 声卡播放（音箱接此）
voice.play_local = 1                # 合成后本板可听播放（Jetson 侧保留块门/时序语义）
voice.mic_source = alsa_input.usb-Jieli_Technology_UACDemoV1.0_4150354132313206-00.mono-fallback  # 本板 USB 麦（pulse 源名，空=禁用）
voice.max_utt_s = 30               # 单句最长（秒，超时强制收句）
port.intent_router = 6666          # 以下三项为 RK→Jetson 跨板 REQ 目的（沿用 jetson.ip）
port.tts_block = 6677
