# ============================================================
# VoxDrive 统一配置（key=value，'#' 注释，值支持 $HOME 展开）
# 查找顺序：$VOX_CONF → 服务可执行文件向上定位 jetson/config/ → ./voxdrive.conf
# 原则：端口/路径/超时/阈值只在这里改，服务代码不写死。
# ============================================================

# ---------- ZMQ 绑定主机 ----------
bind.host = *

# ---------- Jetson 七服务端口 ----------
port.intent_router = 6666        # REP 意图路由入口（ASR/文本查询进来）
port.intent_router_pub = 6671    # PUB 全局事件总线（各服务状态广播）
port.rag = 6667                  # REP 知识库检索
port.llm = 6668                  # REP LLM 代理
port.tool_bus = 6669             # REP 工具总线
port.tool_bus_pub = 6670         # PUB 工具/车控状态（dashboard 订阅）
port.tts_text = 7777             # REP TTS 合成请求
port.tts_block = 6677            # REP ASR/TTS 半双工握手（防回灌）
port.tts_pub = 6678              # PUB 播报结束事件（play_end）
port.llama_http = 8080           # llama.cpp server HTTP

# ---------- 超时 ----------
timeout.req_ms = 5000            # ZMQ REQ/REP 收发超时
timeout.llm_http_s = 120         # LLM HTTP 请求超时
timeout.regression_rcv_s = 20    # 回归脚本等待应答

# ---------- 日志 ----------
log.level = info                 # debug/info/warn/error

# ---------- LLM（llama.cpp + Qwen2.5 GGUF）----------
llm.server_url = http://127.0.0.1:8080
llm.model_name = qwen2.5-1.5b
llm.model = $HOME/Desktop/VoxDrive/models/qwen2.5-1.5b-q4_k_m.gguf
llm.server_bin = $HOME/Desktop/VoxDrive/third_party/llama.cpp/build/bin/llama-server
llm.ngl = 28                     # GPU offload 层数
llm.ctx = 2048                   # 上下文长度
llm.max_history_turns = 6        # 单会话保留对话轮数
llm.max_sessions = 8             # 会话数上限（防长稳内存增长）

# ---------- 模型路径（板上统一模型目录）----------
model.tts = $HOME/Desktop/VoxDrive/models/single_speaker_fast.bin
model.asr_dir = $HOME/Desktop/VoxDrive/models/asr-zipformer-zh-en
model.rag_embedding = $HOME/Desktop/VoxDrive/models/embedding

# ---------- RAG ----------
rag.threshold = 0.5              # 相似度召回阈值（prj1 双阈值 0.5/0.3 中 0.3 为死代码，已合并）
rag.top_k = 3

# ---------- ASR ----------
asr.mic_device = -1              # -1 = PortAudio 默认输入设备
asr.sample_rate = 16000

# ---------- tool_bus ----------
toolbus.sensor_data_file = $HOME/Desktop/VoxDrive/jetson/services/tool_bus/mock_sensor_data.txt

# ---------- TTS ----------
tts.alsa_device = default          # ALSA 播放设备（Jetson 默认输出；无扬声器时播放跳过但协议正常）

# ---------- mediamtx（A10 部署，Jetson 本机）----------
mediamtx.rtmp_port = 1935
mediamtx.http_port = 8888

# ---------- RK3588 节点（Jetson 视角访问 RK 用；RK 本机侧键见下）----------
rk.ip = 192.168.137.200              # RK 板地址（Jetson tool_bus 跨板工具访问）
rk.video_device = /dev/video11     # rkisp mainpath（IMX415 经 dcphy0→rkcif→rkisp，NV12 输出）
rk.capture_width = 1920
rk.capture_height = 1080
rk.capture_fps = 30
rk.capture_buffers = 4             # V4L2 mmap 缓冲数
rk.bitrate_bps = 4000000           # H.264 VBR 目标码率（4Mbps @1080p30）
rk.gop_seconds = 2                 # GOP 时长（I 帧间隔=该值×fps）
rk.rtmp_url = rtmp://192.168.137.190:1935/live/dashcam   # RK 推流目的（Jetson mediamtx）
rk.status_port = 6700            # REQ/REP 录像/存储状态应答
rk.event_port = 6701             # PUB 异常事件上行
rk.storage_dir = $HOME/voxdrive_records
rk.segment_seconds = 60          # 单段录像时长
rk.watermark_percent = 85        # 磁盘水位阈值（触发最旧覆盖）
snapshot_dir = $HOME/voxdrive_snapshots   # 跨板抓拍 JPEG 在 Jetson 的落盘目录
